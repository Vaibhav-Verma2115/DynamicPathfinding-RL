# E2 - Heuristic quality: A* with h=0, Manhattan and 1.5 x Manhattan (4-connected).
# Uses the same map seed family as E1, so maps are identical to E1's.
num_seeds: 30
env:
  placement: corners
  dynamics: static
e2:
  grid_sizes: [10, 20, 30, 50, 70, 100]
  densities: [0.15, 0.30]
  variants:
    - {label: "h=0", heuristic: zero, weight: 1.0}
    - {label: "Manhattan", heuristic: manhattan, weight: 1.0}
    - {label: "1.5 x Manhattan", heuristic: manhattan, weight: 1.5}
  timing_repeats: 5
  map_offset: 10000
