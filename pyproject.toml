[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicpathfinding-rl"
version = "0.1.0"
description = "Comparative performance analysis of classical pathfinding vs. model-free deep RL in dynamic environments"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests (training loops); deselect with -m 'not slow'",
]
